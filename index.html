<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小店日常：餐廳大作戰</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=Noto+Sans+TC:wght@400;600;700;900&display=swap');*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#cbe8d7;color:#233b34;font-family:'DM Sans','Noto Sans TC',sans-serif}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start}.brand,.stats,.panel{background:#fff9;border:1px solid #fff;border-radius:18px;box-shadow:0 8px 28px #315b4030;backdrop-filter:blur(12px)}.brand{padding:12px 18px;font-weight:900;font-size:20px}.brand small{display:block;color:#759082;font-size:11px;letter-spacing:2px}.stats{display:flex;gap:18px;padding:12px 18px;font-weight:800}.stat small{display:block;color:#83978e;font-size:10px;letter-spacing:1px}.stat span{font-size:18px}.panel{position:absolute;left:20px;top:106px;padding:14px 16px;width:205px}.panel h3{margin:0 0 8px;color:#789185;font-size:11px;letter-spacing:1.6px}.goal{font-weight:900;font-size:17px}.bar{height:8px;background:#e5eee8;border-radius:9px;margin:9px 0 5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb44d,#ff8054);border-radius:9px;transition:width .35s}.sub{font-size:12px;color:#71887d}.bottom{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:9px;width:min(90vw,500px)}#prompt{background:#fffdf0;border:2px solid #f3bc59;border-radius:14px;padding:10px 18px;box-shadow:0 8px 28px #315b4030;font-weight:900;font-size:15px;opacity:0;transform:translateY(8px);transition:.2s}#prompt.show{opacity:1;transform:none}.keys{background:#fff9;padding:8px 14px;border-radius:12px;color:#537064;font-size:12px;font-weight:700}.toast{position:absolute;top:105px;left:50%;transform:translateX(-50%);background:#295d49;color:white;border-radius:12px;padding:10px 18px;font-weight:800;opacity:0;transition:.25s}.toast.on{opacity:1}#title{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#204e3eaa,#39776466);z-index:5;transition:.4s}#title.hide{opacity:0;pointer-events:none}.card{width:min(92vw,540px);text-align:center;background:#fffaf0;border-radius:28px;padding:34px 38px;box-shadow:0 24px 70px #173e3066}.eyebrow{font-size:11px;letter-spacing:3px;color:#e99054;font-weight:900}.card h1{font-size:40px;line-height:1.15;margin:8px 0;color:#254a3c}.card p{color:#6b8377;line-height:1.8}.card button{border:0;border-radius:14px;background:#ed8e55;color:white;padding:14px 28px;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 6px 0 #c76e42}.card .hint{font-size:12px;margin-top:17px}@media(max-width:600px){.top{left:10px;right:10px;top:10px}.stats{gap:9px;padding:9px}.brand{font-size:15px;padding:10px}.panel{left:10px;top:76px;padding:10px;width:165px}.stat span{font-size:14px}.card h1{font-size:31px}}
</style></head><body><div id="hud"><div class="top"><div class="brand">小店日常 <small>GARDEN BISTRO · DAY 01</small></div><div class="stats"><div class="stat"><small>營收</small><span id="cash">$0</span></div><div class="stat"><small>倒數</small><span id="timer">02:30</span></div><div class="stat"><small>好評</small><span id="rating">★★★★★</span></div></div></div><div class="panel"><h3>今日目標</h3><div class="goal">營收 $240</div><div class="bar"><i id="progress"></i></div><div class="sub" id="served">完成訂單 0 / 4</div></div><div class="bottom"><div id="prompt"></div><div class="keys">W A S D 移動　·　E 互動　·　把握客人耐心！</div></div><div class="toast" id="toast"></div></div><div id="title"><div class="card"><div class="eyebrow">YOUR LITTLE DREAM STARTS HERE</div><h1>把好味道，<br>送到每一桌</h1><p>在限時營業裡照顧客人、完成訂單，<br>把這間小小花園餐館經營起來！</p><button id="start">開始營業　→</button><div class="hint">WASD 移動　·　E 接單／取餐／送餐／收款／收桌</div></div></div><script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color('#c7e5d6');scene.fog=new THREE.Fog('#c7e5d6',24,48);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,17,19);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff5dd,0x83ad91,2));const sun=new THREE.DirectionalLight(0xffefcf,3);sun.position.set(-7,14,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);const fill=new THREE.DirectionalLight(0xc4ecff,1.2);fill.position.set(8,9,-8);scene.add(fill);
const mats={floor:0xe8d6b6,wall:0xf7ecd5,wood:0xa96f4c,top:0xffd9a3,mint:0x65bda0,red:0xed8069,cream:0xfff7e8,green:0x68a980,blue:0x73a8cd,pink:0xd988a6,yellow:0xe8ba57,dark:0x436653};function mat(c,rough=.8){return new THREE.MeshStandardMaterial({color:c,roughness:rough})}const M={};for(const k in mats)M[k]=mat(mats[k]);
function box(parent,x,y,z,w,h,d,m,r=0){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof m==='string'?M[m]:m);o.position.set(x,y,z);o.rotation.y=r;o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function cyl(parent,x,y,z,rt,rb,h,m){let o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,20),typeof m==='string'?M[m]:m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
// Room shell and tiled floor
box(scene,0,-.22,0,18,.4,14,'floor');box(scene,0,2,-7,18,4,.25,'wall');box(scene,-9,2,0,.25,4,14,'wall');box(scene,9,2,0,.25,4,14,'wall');box(scene,0,4.1,-1,18,.18,12,'cream');
// decorative floor tile grid
for(let x=-8;x<=8;x+=2)for(let z=-6;z<=6;z+=2)box(scene,x,-.005,z,1.93,.012,1.93,((x+z)%4===0?'cream':'floor'));
// counter and kitchen at back
box(scene,-3,.65,-5.4,7,.9,1.15,'wood');box(scene,-3,1.2,-5.4,7.15,.18,1.25,'cream');box(scene,-5.8,1.9,-6.65,1.8,1.5,'mint');box(scene,-3.3,1.9,-6.65,2.8,1.5,'cream');box(scene,-.1,1.9,-6.65,3,1.5,'red');box(scene,-3,2.85,-6.65,6.7,.13,.18,'top');
// pass shelf highlight
box(scene,-3,.13,-4.5,1.5,.08,.55,'yellow');
// tables & chairs
const tables=[{x:3.1,z:-2.5},{x:6,z:-2.5},{x:3.1,z:1.5},{x:6,z:1.5},{x:3.1,z:5},{x:6,z:5}];for(let i=0;i<tables.length;i++){const t=tables[i];cyl(scene,t.x,.82,t.z,.82,.82,.18,'wood');cyl(scene,t.x,.94,t.z,.76,.76,.08,'top');cyl(scene,t.x,.39,t.z,.16,.25,.7,'wood');for(const a of [0,Math.PI/2,Math.PI,Math.PI*1.5]){let x=t.x+Math.cos(a)*1.15,z=t.z+Math.sin(a)*1.15;box(scene,x,.42,z,.62,.18,.62,'mint',a)} }
// windows, planters and wall accents
for(let x of [-6,-3,0,3,6]){box(scene,x,2.6,-6.83,1.9,1.35,.08,'blue');box(scene,x,2.6,-6.76,1.72,1.17,.08,'cream');box(scene,x,2.6,-6.69,1.56,1.02,.04,'blue')}
for(const p of [[-7,3.2],[7,3.2],[-7,-3],[7,-3]]){cyl(scene,p[0],.25,p[1],.55,.62,.45,'wood');for(let i=0;i<5;i++){let a=i*1.25;cyl(scene,p[0]+Math.cos(a)*.28,.75+Math.sin(i)*.1,p[1]+Math.sin(a)*.28,.18,.07,.9,i%2?'green':'mint')}}
// lamp pendants
for(const x of [-4,0,4]){cyl(scene,x,3.65,-1.5,.045,.045,.8,'wood');let l=new THREE.PointLight(0xffc879,15,7);l.position.set(x,3,-1.5);scene.add(l);let shade=new THREE.Mesh(new THREE.ConeGeometry(.55,.4,24),M.top);shade.position.set(x,3.3,-1.5);scene.add(shade)}
// Character
const player=new THREE.Group();scene.add(player);player.position.set(0,0,2.8);cyl(player,0,.65,0,.34,.35,.8,'mint');let head=new THREE.Mesh(new THREE.SphereGeometry(.3,20,16),mat(0xffd1aa));head.position.set(0,1.25,0);head.castShadow=true;player.add(head);box(player,0,.35,.08,.55,.17,.48,'cream');for(let x of [-.12,.12]){let eye=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),mat(0x345244));eye.position.set(x,1.29,.26);player.add(eye)}let hat=cyl(player,0,1.55,0,.36,.28,.13,'red');
// Guest character models
const seats=[{x:3.1,z:-2.5},{x:6,z:-2.5},{x:3.1,z:1.5},{x:6,z:1.5},{x:3.1,z:5},{x:6,z:5}];const guestColors=['pink','blue','yellow','red','mint','green'];let guests=[];function guestMesh(i){let g=new THREE.Group();let color=M[guestColors[i%guestColors.length]];cyl(g,0,.58,0,.31,.32,.7,color);let h=new THREE.Mesh(new THREE.SphereGeometry(.27,18,14),mat([0xffd4b5,0xe8b98f,0xf2c9a3][i%3]));h.position.y=1.08;g.add(h);for(let x of [-.1,.1]){let e=new THREE.Mesh(new THREE.SphereGeometry(.025,8,8),mat(0x38443e));e.position.set(x,1.1,.235);g.add(e)}scene.add(g);return g}
const state={active:false,seconds:150,cash:0,served:0,lost:0,queue:[],order:null,carrying:false,toastTimer:0};const prompt=document.querySelector('#prompt');function say(s){let e=document.querySelector('#toast');e.textContent=s;e.classList.add('on');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>e.classList.remove('on'),1500)}
function spawn(){if(!state.active||guests.length>=6)return;let i=guests.length+state.served+state.lost;let g={id:Date.now()+Math.random(),mesh:guestMesh(i),seat:null,phase:'queue',wait:42,patience:100,order:['香煎奶油義大利麵','莓果鬆餅','花園野菇燉飯'][i%3],value:60+(i%3)*15};g.mesh.position.set(-6,.0,5.8+Math.random());guests.push(g);state.queue.push(g);say('新客人來了！先到櫃台接單')}
function near(x,z,r=1.65){return Math.hypot(player.position.x-x,player.position.z-z)<r}
function station(){if(near(-3,-5.4,2.3))return 'kitchen';for(let i=0;i<tables.length;i++)if(near(tables[i].x,tables[i].z,1.55)){let g=guests.find(a=>a.seat===i);if(g)return g.phase==='waiting'?'order':g.phase==='eating'?'pay':g.phase==='dirty'?'clean':null}if(near(-7,5.8,2.4)&&state.queue.length)return 'seat';return null}
function action(){if(!state.active)return;let s=station();if(!s){say('靠近櫃台、客人或空桌再按 E');return}if(s==='kitchen'){if(!state.order){say('先到候位區接單！');return}if(state.order.phase==='ordered'){state.order.phase='ready';state.carrying=true;box(scene,-3,.35,-4.5,.48,.35,.4,'red');say('餐點完成！送到客人桌邊');}else say('餐點正在準備中…');return}if(s==='seat'){let g=state.queue.shift(),i=guests.findIndex(a=>a.seat===null&&a.phase==='seated');let seat=tables.findIndex((t,j)=>!guests.some(a=>a.seat===j&&a.phase!=='gone'));if(seat<0){state.queue.unshift(g);say('目前沒有空桌');return}g.seat=seat;g.phase='seated';g.mesh.position.set(seats[seat].x,0,seats[seat].z+1.15);say('帶位完成！客人在等你點餐');return}let g=guests.find(a=>a.seat===tables.findIndex(t=>near(t.x,t.z,1.55)));if(!g)return;if(g.phase==='waiting'){if(state.order){say('先完成手上的訂單！');return}g.phase='ordered';state.order=g;say('已接單：'+g.order+'，到廚房取餐');return}if(g.phase==='eating'){g.phase='paid';state.cash+=g.value;state.served++;say('收款 +$'+g.value+'！好評！');return}if(g.phase==='dirty'){g.phase='gone';g.mesh.visible=false;g.seat=null;say('桌面整理好了');return}if(g.phase==='ordered'&&state.carrying&&state.order===g){g.phase='eating';state.carrying=false;state.order=null;setTimeout(()=>{if(g.phase==='eating')g.phase='pay'},4200);say('上菜成功！稍後回來收款');return}say('這位客人正在用餐')}
// Fixed interaction target action priority near table
function doAction(){if(!state.active)return;let tIdx=tables.findIndex(t=>near(t.x,t.z,1.65));if(tIdx>=0){let g=guests.find(a=>a.seat===tIdx);if(g){if(g.phase==='waiting'){if(state.order){say('先完成手上的訂單！');return}g.phase='ordered';state.order=g;say('已接單：'+g.order+'，到廚房取餐');return}if(g.phase==='ordered'){if(state.carrying&&state.order===g){g.phase='eating';state.carrying=false;state.order=null;setTimeout(()=>{if(g.phase==='eating')g.phase='pay'},4200);say('上菜成功！');return}say('餐還在廚房，快去取餐！');return}if(g.phase==='pay'){g.phase='dirty';state.cash+=g.value;state.served++;say('收款 +$'+g.value+'！');return}if(g.phase==='dirty'){g.phase='gone';g.mesh.visible=false;g.seat=null;say('收桌完成，空桌可再次帶位');return}say('客人正在用餐');return}}
if(near(-3,-5.4,2.3)){if(state.order&&state.order.phase==='ordered'){state.order.phase='ready';state.carrying=true;say('取餐完成！送到對應桌位');return}say(state.order?'正在準備，先去送餐':'先接到客人的訂單');return}if(near(-7,5.8,2.5)&&state.queue.length){let seat=tables.findIndex((t,j)=>!guests.some(a=>a.seat===j&&a.phase!=='gone'));if(seat<0){say('目前沒有空桌');return}let g=state.queue.shift();g.seat=seat;g.phase='waiting';g.mesh.position.set(tables[seat].x,0,tables[seat].z+1.15);say('帶位完成！去客人桌邊接單');return}say('靠近櫃台、客人或餐桌再按 E')}
function updateUI(){document.querySelector('#cash').textContent='$'+state.cash;let m=Math.floor(state.seconds/60),s=Math.floor(state.seconds%60);document.querySelector('#timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;document.querySelector('#served').textContent=`完成訂單 ${state.served} / 4　·　離席 ${state.lost}`;document.querySelector('#progress').style.width=Math.min(100,state.cash/240*100)+'%';let st=station(),label='';if(st==='kitchen')label=state.order?.phase==='ordered'?'E　取餐':'E　廚房';else if(st==='seat')label='E　帶位';else{let idx=tables.findIndex(t=>near(t.x,t.z,1.65));if(idx>=0){let g=guests.find(a=>a.seat===idx);if(g)label=g.phase==='waiting'?'E　接單':g.phase==='pay'?'E　收款':g.phase==='dirty'?'E　收桌':g.phase==='ordered'&&state.carrying?'E　送餐':'客人用餐中'}}prompt.textContent=label;prompt.classList.toggle('show',!!label)}
let keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE'&&!e.repeat)doAction();if(['KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);document.querySelector('#start').onclick=()=>{document.querySelector('#title').classList.add('hide');state.active=true;spawn();setTimeout(spawn,8500);setTimeout(spawn,17500)};
let clock=0;function tick(dt){if(state.active){state.seconds=Math.max(0,state.seconds-dt);let dx=(+!!keys.KeyD)-(+!!keys.KeyA),dz=(+!!keys.KeyS)-(+!!keys.KeyW);let l=Math.hypot(dx,dz)||1;player.position.x=THREE.MathUtils.clamp(player.position.x+dx/l*dt*5,-8,8);player.position.z=THREE.MathUtils.clamp(player.position.z+dz/l*dt*5,-6.2,6.2);player.rotation.y=Math.atan2(dx,dz);for(const g of guests){if(g.phase==='queue'){g.wait-=dt;g.patience=Math.max(0,g.wait/42*100);if(g.wait<=0){g.phase='gone';g.mesh.visible=false;state.queue=state.queue.filter(a=>a!==g);state.lost++;say('客人等太久離開了！')}}if(g.phase==='pay'){/* order served, ready for payment */}}if(state.seconds<=0){state.active=false;document.querySelector('.card h1').innerHTML=state.cash>=240?'今日大豐收！':'明天再接再厲';document.querySelector('.card p').innerHTML=`營業額 <b>$${state.cash}</b>　·　完成訂單 ${state.served} 張<br>${state.cash>=240?'達成今日目標，餐館聲名大噪！':'再多練習接單與送餐，挑戰目標！'}`;document.querySelector('#start').textContent='再營業一次';document.querySelector('#title').classList.remove('hide');document.querySelector('#start').onclick=()=>location.reload()}updateUI()}}
window.render_game_to_text=()=>JSON.stringify({cash:state.cash,seconds:state.seconds,served:state.served,lost:state.lost,queue:state.queue.length,order:state.order?.phase||null,player:[player.position.x,player.position.z]});window.advanceTime=ms=>{let n=Math.ceil(ms/16);for(let i=0;i<n;i++)tick(Math.min(.016,ms/1000/n))};
const clocker=new THREE.Clock();function frame(){requestAnimationFrame(frame);let dt=Math.min(.05,clocker.getDelta());clock+=dt;tick(dt);camera.position.x=THREE.MathUtils.lerp(camera.position.x,player.position.x*.3,.035);camera.position.z=THREE.MathUtils.lerp(camera.position.z,19+player.position.z*.12,.035);camera.lookAt(player.position.x*.2,0,0);renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
