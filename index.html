 ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(8,8,304,78,28);ctx.fill();ctx.strokeStyle='#ffffff';ctx.lineWidth=5;ctx.stroke();

function dish(){const g=new THREE.Group();const plate=new THREE.Mesh(new THREE.CylinderGeometry(.44,.4,.08,28),mat(0xfffaf0));plate.position.y=.05;g.add(plate);const rim=new THREE.Mesh(new THREE.TorusGeometry(.34,.025,8,28),mat(0xe9b86c));rim.rotation.x=Math.PI/2;rim.position.y=.1;g.add(rim);for(let i=0;i<5;i++){const food=new THREE.Mesh(new THREE.SphereGeometry(.13,12,10),mat(i%2?0xe9a74f:0xf1c765));food.position.set(Math.cos(i*1.25)*.16,.18+Math.random()*.025,Math.sin(i*1.25)*.14);food.scale.set(1,.55,1);g.add(food)}for(let i=0;i<3;i++){const leaf=new THREE.Mesh(new THREE.SphereGeometry(.08,10,8),mat(0x68aa72));leaf.position.set(-.12+i*.1,.22,-.12);leaf.scale.set(.6,.25,1.2);g.add(leaf)}return g}

const state={active:false,seconds:150,cash:0,served:0,lost:0,queue:[],order:null,carrying:false,toastTimer:0,cookDuration:4};const prompt=document.querySelector('#prompt');function say(s){let e=document.querySelector('#toast');e.textContent=s;e.classList.add('on');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>e.classList.remove('on'),1500)}

 if(!state.active)return;
 const tIdx=tables.findIndex(t=>near(t.x,t.z,1.65));
 if(tIdx>=0){const g=guests.find(a=>a.seat===tIdx&&a.phase!=='gone');if(g){

 else if(state.queue.length){title='客人在排隊';desc=`目前 ${state.queue.length} 位客人在等帶位，快到入口接待。`;foot='入口在畫面左下　·　E 帶位'}
 document.querySelector('#workTitle').textContent=title;document.querySelector('#workText').textContent=desc;document.querySelector('#workProgress').style.width=pct+'%';document.querySelector('#workFoot').textContent=foot;
 if(st==='kitchen'){label=state.order?.phase==='ready'&&!state.carrying?'E　領取餐點':state.order?.phase==='cooking'?'製作中…':'E　出餐台'}else if(st==='seat')label='E　帶客人入座';else{const idx=tables.findIndex(t=>near(t.x,t.z,1.65));if(idx>=0){const c=guests.find(a=>a.seat===idx&&a.phase!=='gone');if(c)label=c.phase==='waiting'?'E　接單':c.phase==='pay'?`E　收款 +$${c.value}`:c.phase==='dirty'?'E　收拾餐桌':c.phase==='ready'&&state.carrying?'E　送餐':c.phase==='cooking'?'餐點製作中…':c.phase==='eating'?'客人用餐中…':'客人已點餐'}}
 prompt.textContent=label;prompt.classList.toggle('show',!!label);
}
let keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE'&&!e.repeat)doAction();if(['KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);document.querySelector('#start').onclick=()=>{document.querySelector('#title').classList.add('hide');state.active=true;spawn();setTimeout(spawn,8500);setTimeout(spawn,17500)};
let clock=0;function tick(dt){if(state.active){state.seconds=Math.max(0,state.seconds-dt);let dx=(+!!keys.KeyD)-(+!!keys.KeyA),dz=(+!!keys.KeyS)-(+!!keys.KeyW);let l=Math.hypot(dx,dz)||1;player.position.x=THREE.MathUtils.clamp(player.position.x+dx/l*dt*5,-8,8);player.position.z=THREE.MathUtils.clamp(player.position.z+dz/l*dt*5,-6.2,6.2);player.rotation.y=Math.atan2(dx,dz);for(const g of guests){if(g.phase==='queue'){g.wait-=dt;g.patience=Math.max(0,g.wait/42*100);if(g.wait<=0){g.phase='gone';g.mesh.visible=false;g.badge.visible=false;state.queue=state.queue.filter(a=>a!==g);state.lost++;say('客人等太久離開了！')}}if(g.phase==='cooking'){g.cook+=dt;if(g.cook>=state.cookDuration){g.phase='ready';counterDish.visible=true;updateGuestBadge(g);say('叮！餐點完成，快到出餐台領餐！')}}if(g.phase==='eating'){g.mealTimer=(g.mealTimer||3.5)-dt;if(g.mealTimer<=0){g.phase='pay';billBadges[g.seat].visible=true;updateGuestBadge(g);say('客人吃完了！回桌邊收款')}}}if(state.seconds<=0){state.active=false;document.querySelector('.card h1').innerHTML=state.cash>=240?'今日大豐收！':'明天再接再厲';document.querySelector('.card p').innerHTML=`營業額 <b>$${state.cash}</b>　·　完成訂單 ${state.served} 張<br>${state.cash>=240?'達成今日目標，餐館聲名大噪！':'再多練習接單與送餐，挑戰目標！'}`;document.querySelector('#start').textContent='再營業一次';document.querySelector('#title').classList.remove('hide');document.querySelector('#start').onclick=()=>location.reload()}updateUI()}}
window.render_game_to_text=()=>JSON.stringify({cash:state.cash,seconds:state.seconds,served:state.served,lost:state.lost,queue:state.queue.length,order:state.order?.phase||null,player:[player.position.x,player.position.z]});window.advanceTime=ms=>{let n=Math.ceil(ms/16);for(let i=0;i<n;i++)tick(Math.min(.016,ms/1000/n))};
const clocker=new THREE.Clock();function frame(){requestAnimationFrame(frame);let dt=Math.min(.05,clocker.getDelta());clock+=dt;tick(dt);camera.position.x=THREE.MathUtils.lerp(camera.position.x,player.position.x*.3,.035);camera.position.z=THREE.MathUtils.lerp(camera.position.z,19+player.position.z*.12,.035);camera.lookAt(player.position.x*.2,0,0);renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
